# SceneFab AI LLM 配置
#
# 各家最新可用旗舰大模型：
#   - OpenAI:     gpt-5.6         (旗舰 Sol，另有 terra/luna 档, openai.com/index/gpt-5-6)
#   - Anthropic:  claude-fable-5  (Mythos-class, 2026-06-09, 1M context)
#   - Google:     gemini-3.6-flash / gemini-3.5-flash (2026-07-21 最新 stable)
#   - DeepSeek:   deepseek-v4-pro / -flash  (官方 api-docs.deepseek.com)
#   - Qwen:       qwen3.7-max     (阿里云百炼 2026 最新旗舰)
#   - Kimi:       kimi-k3         (月之暗面 2026-07-16 发布, 1M context)
#   - 智谱:       glm-5.2         (2026 最新旗舰, 1M 无损上下文)
#   - 豆包:       doubao-seed-2-1-pro (火山方舟 2026-06-23 发布)
#   - 混元:       hy3             (腾讯 Hy3, 295B MoE, 256K context)
#
# 切换 provider：把 default_provider 改为你想启用的那家，
# 并在对应 block 里把 enabled: true。

LLM:
  # 默认提供商 (qwen | kimi | glm5 | openai | deepseek | claude | gemini | local | doubao | hunyuan)
  default_provider: "kimi"

  # ─── 通义千问 Qwen3.7-Max（阿里云百炼 / DashScope）─────────────────
  # 2026 最新旗舰基座，对位 GPT-5.5 / Claude Opus 4.7，专为 Agent 优化。
  # 备选：qwen3.7-plus（次旗舰）、qwen3-max-2025-09-23（上一代快照）。
  # Token Plan 订阅用户可解锁 qwen3.8-max-preview（更更新但仍在 preview）。
  qwen:
    enabled: false
    api_key: ${QWEN_API_KEY}
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model: "qwen3.7-max"
    max_tokens: 32768
    temperature: 0.7
    top_p: 0.9

  # ─── DeepSeek V4（深度求索，官方 api-docs.deepseek.com）───────────────
  # V4 系列：V4-Pro（旗舰，思考/非思考双模式）+ V4-Flash（轻量快速）。
  deepseek:
    enabled: false
    api_key: ${DEEPSEEK_API_KEY}
    base_url: "https://api.deepseek.com"
    model: "deepseek-v4-pro"
    max_tokens: 32768
    temperature: 0.7

  # ─── Kimi K3（Moonshot 月之暗面，2026-07 最新）──────────────────────
  # K3：2.8 万亿参数、1M token 上下文、原生多模态、Tool Calling 增强。
  # 备选：kimi-k2.6（通用上一代）、kimi-k2.7-code（Coding 专用）。
  # 旧 moonshot-v1 / kimi-k2.5 已于 8 月 31 日下线。
  kimi:
    enabled: true
    api_key: ${KIMI_API_KEY}
    base_url: "https://api.moonshot.cn/v1"
    model: "kimi-k3"
    max_tokens: 32768
    temperature: 0.7

  # ─── 智谱 GLM-5（BigModel，2026-02-11 旗舰）─────────────────────────
  # GLM-5.2：1M 无损上下文，支撑复杂长程任务；Coding 能力开源 SOTA，
  # 从代码生成走向工程交付（docs.bigmodel.cn 确认 model="glm-5.2"）。
  # 备选：glm-5.1（长程任务可自主工作 8h）、glm-5、glm-5-turbo（轻量）。
  glm5:
    enabled: false
    api_key: ${GLM5_API_KEY}
    base_url: "https://open.bigmodel.cn/api/paas/v4/"
    model: "glm-5.2"
    max_tokens: 32768
    temperature: 0.7

  # ─── OpenAI GPT-5.6 ─────────────────────────────────────────────────
  # OpenAI 2026 最新旗舰家族（openai.com/index/gpt-5-6），三档：
  #   gpt-5.6-sol（旗舰 $5/$30）、gpt-5.6-terra（均衡 $2.5/$15）、
  #   gpt-5.6-luna（快速 $1/$6）。别名 gpt-5.6 路由到 sol。
  # 备选：gpt-5.5 / gpt-5.5-pro（上一代，2026-04）。
  openai:
    enabled: false
    api_key: ${OPENAI_API_KEY}
    base_url: "https://api.openai.com/v1"
    model: "gpt-5.6"
    max_tokens: 32768
    temperature: 0.7

  # ─── Anthropic Claude（Anthropic 官方）─────────────────────────────
  # Claude Fable 5（2026-06-09, anthropic.com/news/claude-fable-5-mythos-5），
  # 首个 Mythos-class 广泛可用模型，1M context，$10/M in $50/M out。
  # claude-mythos-5 仅限少量用户。备选：claude-opus-5 / claude-sonnet-5、
  # claude-opus-4-8（上一代）。
  claude:
    enabled: false
    api_key: ${CLAUDE_API_KEY}
    base_url: "https://api.anthropic.com"
    model: "claude-fable-5"
    max_tokens: 16384
    temperature: 0.7

  # ─── Google Gemini 3.6 Flash（Google AI Studio）────────────────────
  # gemini-3.6-flash 是 2026-07-21 最新 stable "workhorse" 档（ai.google.dev
  # 模型列表确认），在 coding / agentic / 多模态任务上优于上一代。
  # gemini-3.5-flash 是 stable 中"最强智能"档；3.5-flash-lite 最快最省。
  # gemini-3.1-pro-preview 仅为 preview（Pro 暂无 stable GA）。
  # 备选：gemini-flash-latest（永远指向最新 Flash 版的 alias）。
  gemini:
    enabled: false
    api_key: ${GEMINI_API_KEY}
    base_url: "https://generativelanguage.googleapis.com"
    model: "gemini-3.6-flash"
    max_tokens: 8000
    temperature: 0.7

  # ─── 本地模型（Ollama / LM Studio）─────────────────────────────────
  # 推荐 qwen3:32b / deepseek-v4:64b（本地量级）。
  local:
    enabled: false
    api_key: ""
    base_url: "http://localhost:11434"
    backend: "ollama"
    model: "qwen3:32b"

  # ─── 字节豆包 Doubao（火山方舟 Ark）────────────────────────────────
  # Doubao-Seed-2.1（2026-06-23 FORCE 大会发布）：Coding 进入国际第一
  # 梯队，Agent 可自主运行 18h。API 已全量上线方舟：doubao-seed-2-1-pro /
  # doubao-seed-2-1-turbo。备选：doubao-seed-2-0-pro、doubao-1-5-pro-256k。
  # 视频/图片：Seedance 2.5（视频）、Seedream 5.0 pro（图片）。
  doubao:
    enabled: false
    api_key: ${DOUBAO_API_KEY}
    base_url: "https://ark.cn-beijing.volces.com/api/v3"
    model: "doubao-seed-2-1-pro"
    max_tokens: 32768
    temperature: 0.7

  # ─── 腾讯混元 Hunyuan-TurboS（腾讯云）───────────────────────────────
  # Hy3：295B MoE（激活 21B），256K 上下文，强化 Coding/长文/推理/Agent，
  # 盲测优于 GLM-5.1（hy.tencent.com/research/hy3）。model 参数为 "hy3"，
  # 走 OpenAI 兼容接口。备选：hunyuan-turbos（上一代旗舰）、
  # hunyuan-standard-256k。
  hunyuan:
    enabled: false
    api_key: ${HUNYUAN_API_KEY}
    base_url: "https://api.hunyuan.cloud.tencent.com/v1"
    model: "hy3"
    max_tokens: 8000
    temperature: 0.7
