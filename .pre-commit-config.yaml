# Vynaro v1.0.0 · .pre-commit-config.yaml
# 适配 Rust + Tauri 2 + React 主线，Python hooks 保留
# （bin/ + scripts/ 仍有 6 个工具脚本需 Python 格式化）
# 见 https://pre-commit.com

repos:
  # ── Python 工具脚本 ─────────────────────────────────────
  # ruff 统一替代 isort + black + flake8,速度更快
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff          # lint,自动 fix
        args: [--fix]
      - id: ruff-format   # 替代 isort + black

  # ── Rust 主线 ──────────────────────────────────────────
  # 13 领域 crate + Tauri entry,workspace 统一格式化
  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt
        name: cargo fmt --all
        args: [--all]

# ── 跳过 ────────────────────────────────────────────────
# - markdownlint-cli2: 已在 CI 跑(docs-lint.yml)
# - cspell: 已在 CI 跑(docs-spellcheck.yml)
# - prettier: 不引入,避免与 markdownlint-cli2 冲突
# - cargo clippy: 运行成本高,放 CI(pr-check.yml 已含)
# - mypy: Python v2.4 已退役,6 个工具脚本无需类型检查
# - yamllint: 本地工具链外,放宽 strict 模式需自定义配置,
#             暂不在 pre-commit 强制（CI workflows 仍由 GitHub Actions 验证）