<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 560 160"
     role="img"
     aria-label="Vynaro — 叙影 AI 视频解说创作工具">
  <title>Vynaro</title>
  <defs>
    <linearGradient id="bgHLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="brandGoldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" rx="20" fill="#FFFFFF" opacity="0.9"/>

  <!-- Logo Mark -->
  <g transform="translate(16 16)">
    <rect width="128" height="128" rx="28" fill="url(#bgHLight)"/>
    <rect x="0.5" y="0.5" width="127" height="127" rx="27.5" fill="none"
          stroke="url(#brandGoldLight)" stroke-width="1" opacity="0.4"/>

    <circle cx="64" cy="64" r="46" fill="none"
            stroke="url(#brandGoldLight)" stroke-width="1.6"
            stroke-dasharray="3 5" opacity="0.65"/>
    <circle cx="64" cy="64" r="34" fill="none"
            stroke="url(#brandGoldLight)" stroke-width="0.9" opacity="0.75"/>

    <g transform="translate(64 64)">
      <circle r="22" fill="#FFFFFF"/>
      <circle r="22" fill="none" stroke="url(#brandGoldLight)" stroke-width="1" opacity="0.7"/>
      <path d="M -5 -8 L 9 0 L -5 8 Z" fill="url(#brandGoldLight)"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(168 0)">
    <text x="0" y="78"
