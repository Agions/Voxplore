          font-size="52"
          font-weight="800"
          fill="#0F172A"
          letter-spacing="-1.5">Vynaro<tspan fill="url(#brandGoldLight)"> .叙影</tspan></text>

    <text x="2" y="108"
          font-family="'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif"
          font-size="14"
          font-weight="600"
