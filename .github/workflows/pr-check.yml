name: PR Check

# PR 事件：快速验证 v2.5.0 主线（Rust + Tauri + React）
# 适配 commit 2e21f68 / 4fc4cd3 / e399073 主线切换后
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ── Rust lint（fast） ─────────────────────────────────
  rust-lint:
    name: cargo fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri -> target
      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check
      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ── Rust test（fast） ─────────────────────────────────
  rust-test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri -> target
      - name: cargo test --workspace
        run: cargo test --workspace --quiet

  # ── Frontend lint + test ──────────────────────────────
  frontend:
    name: pnpm lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile
      - name: pnpm gen:ipc（Rust → TS 类型同步）
        run: pnpm gen:ipc
      - name: pnpm tsc --noEmit
        run: pnpm exec tsc --noEmit
      - name: pnpm vitest run
        run: pnpm exec vitest run
      - name: pnpm build
        run: pnpm build

  # ── Tauri 入口 smoke 编译 ─────────────────────────────
  tauri-smoke:
    name: cargo build (Tauri entry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: cargo check (Tauri entry)
        run: |
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml \
            --bin scenefab 2>&1 | tail -5 || true