name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Rust Lint & Test ──────────────────────────────────
  rust:
    name: Rust (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri -> target
      - name: Cargo Format Check
        run: cargo fmt --all -- --check
      - name: Cargo Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Cargo Test
        run: cargo test --workspace --quiet

  # ── Frontend Lint & Test & Build ──────────────────────
  frontend:
    name: Frontend (tsc + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate IPC Types
        run: pnpm gen:ipc
      - name: TypeScript Check
        run: pnpm exec tsc --noEmit
      - name: Vitest Run
        run: pnpm exec vitest run
      - name: Vite Build Check
        run: pnpm build

  # ── Docs Integrity Check ──────────────────────────────
  docs-check:
    name: Docs (links & format check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Docs Format Check
        run: node scripts/docs-check-format.mjs
      - name: Docs Links Check
        run: node scripts/docs-check-links.mjs