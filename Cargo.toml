[workspace]
resolver = "2"
members = [
    # ── Rust 业务 crates (12 个,按 7 步工作流分层) ──
    # 基础层
    "crates/core",      # 核心抽象·错误类型·事件总线·跨 crate trait
    "crates/domain",    # 业务模型·Project/Scene/Script/Clip/VoiceClone
    # Step 1  素材导入
    "crates/intake",    # 本地导入·元数据提取·缩略图·格式检测
    # Step 2  智能拆条
    "crates/detect",    # FFmpeg 场景检测·情绪峰值·关键帧·集数扫描
    # Step 3  脚本生成
    "crates/script",    # 11 LLM Provider·第一人称风格引擎·流式输出
    # Step 4  TTS 配音
    "crates/voice",     # Edge-TTS/OpenAI-TTS/GPT-SoVITS·人声克隆·情绪适配
    # Step 5  字幕合成
    "crates/subtitle",  # VAD端点检测·SRT/VTT/ASS·动态字幕·双语
    # Step 6  画面对齐
    "crates/compose",   # 节奏匹配·BGM混音·时间轴合成·DAG并行
    # Step 7  多平台导出
    "crates/export",    # 8平台预设·剪映草稿(优先)·封面生成·竖屏裁剪
    # 基础设施
    "crates/plugin",    # WASM 插件运行时·Provider 热插拔
    "crates/storage",   # 项目持久化·SQLite·缩略图缓存·断点续传·API Key(Keychain)
    "crates/update",    # 自动更新引擎·版本检查·SemVer
    # ── Tauri 2 桌面应用入口 ──
    "src-tauri",
]

[workspace.package]
version = "1.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Agions"]
repository = "https://github.com/agions/splicr"
homepage = "https://splicr.dev"

[workspace.dependencies]
# Tauri 2 + 插件
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-system-tray = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"

# 序列化 & 类型
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ts-rs = { version = "10", features = ["serde-compat"] }
specta = { version = "2.0.0-rc", features = ["derive"] }
specta-typescript = "0.0.9"

# 错误处理
thiserror = "2"
anyhow = "1"

# 异步运行时
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
rayon = "1.10"

# HTTP 客户端
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

# 系统调用
dirs = "5"
keyring = "3"
ring = "0.17"

# 进程 & IO
serde_with = "3"
walkdir = "2"
notify = "6"

# 时间
chrono = { version = "0.4", features = ["serde"] }
time = { version = "0.3", features = ["serde", "formatting"] }
semver = { version = "1", features = ["serde"] }

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# 数据持久化
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "postgres", "macros", "chrono"] }
sled = "0.34"

# WASM 插件运行时
wasmtime = "29"
wasmtime-wasi = "29"

# 测试
tokio-test = "0.4"
mockall = "0.13"
proptest = "1.5"
rstest = "0.25"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_imports = "warn"
dead_code = "warn"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true
incremental = true
