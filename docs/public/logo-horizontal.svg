<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 560 160"
     role="img"
     aria-label="Vynaro — 叙影 AI 视频解说创作工具">
  <title>Vynaro</title>
  <defs>
    <linearGradient id="bgH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121216"/>
      <stop offset="100%" stop-color="#1A1A20"/>
    </linearGradient>
    <linearGradient id="brandGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5C842"/>
      <stop offset="50%" stop-color="#E8933A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="coreGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F5C842"/>
    </linearGradient>
    <linearGradient id="hiGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5C842"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <filter id="glowH" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" rx="20" fill="#0A0A0E" opacity="0.6"/>

  <g transform="translate(16 16)">
    <rect width="128" height="128" rx="28" fill="url(#bgH)"/>
    <rect x="0.5" y="0.5" width="127" height="127" rx="27.5" fill="none"
          stroke="url(#brandGold)" stroke-width="1" opacity="0.4"/>

    <circle cx="64" cy="64" r="46" fill="none"
            stroke="url(#brandGold)" stroke-width="1.6"
            stroke-dasharray="3 5" opacity="0.65"/>
    <circle cx="64" cy="64" r="34" fill="none"
            stroke="url(#brandGold)" stroke-width="0.9" opacity="0.75"/>

    <g fill="url(#hiGold)">
      <circle cx="64" cy="18"  r="1.6"/>
      <circle cx="110" cy="64" r="1.6"/>
      <circle cx="64" cy="110" r="1.6"/>
      <circle cx="18" cy="64"  r="1.6"/>
    </g>

    <g transform="translate(64 64)">
      <circle r="22" fill="#121216"/>
      <circle r="22" fill="none" stroke="url(#brandGold)" stroke-width="1" opacity="0.7"/>
      <path d="M -14 0 A 14 14 0 0 1 0 -14" fill="none"
            stroke="url(#hiGold)" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>
      <path d="M 14 0 A 14 14 0 0 1 0 14" fill="none"
            stroke="url(#hiGold)" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>
      <path d="M -5 -8 L 9 0 L -5 8 Z" fill="url(#coreGold)" filter="url(#glowH)"/>
    </g>

    <path d="M 98 30 L 99.5 33 L 103 34.5 L 99.5 36 L 98 39 L 96.5 36 L 93 34.5 L 96.5 33 Z"
          fill="url(#hiGold)" opacity="0.9"/>
  </g>

  <g transform="translate(168 0)">
    <text x="0" y="78"
          font-family="Inter, 'SF Pro Display', system-ui, sans-serif"
          font-size="52"
          font-weight="800"
          fill="#F0EDE8"
          letter-spacing="-1.5">Vynaro<tspan fill="url(#brandGold)"> .叙影</tspan></text>

    <text x="2" y="108"
          font-family="'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif"
          font-size="14"
          font-weight="600"
          fill="#8A8680"
          letter-spacing="2.0">AI 第一人称影视解说创作工具 · 7 步智能流水线</text>
  </g>
</svg>