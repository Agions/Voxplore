<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A1A1E"/>
      <stop offset="100%" stop-color="#0D0D0F"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F9D76B"/>
      <stop offset="50%" stop-color="#F5C842"/>
      <stop offset="100%" stop-color="#E8933A"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with golden glowing border -->
  <rect x="48" y="48" width="928" height="928" rx="224" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="20"/>

  <!-- Pen Nib (Left Part) -->
  <path d="M220 512 L420 280 L520 380 L360 640 Z" fill="url(#goldGrad)" filter="url(#goldGlow)"/>
  <circle cx="340" cy="512" r="32" fill="#0D0D0F"/>

  <!-- Play Triangle (Right Part) -->
  <path d="M460 310 L820 512 L460 714 Z" fill="url(#goldGrad)" filter="url(#goldGlow)"/>

  <!-- Stylized Geometric V Accent Line -->
  <path d="M260 760 L512 870 L764 760" stroke="url(#goldGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
