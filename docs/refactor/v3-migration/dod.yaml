# SceneFab v3.0 · DoD 可机读清单（CI 集成）
#
# 用途：被 scripts/dod-check.sh 与 .github/workflows/dod.yml 引用
# 任何 expect_*_zero / expect_pass 不达标则阻塞 GA
# 维护者：TL / RA / FE / QA 联合签字
# 最后更新：2026-08-04

version: "1.0.0"

# ═══════════════════════════════════════════════════════════════════
# 必备产物（构建期存在性检查）
# ═══════════════════════════════════════════════════════════════════
prerequisites:
  - { file: "bin/scenefab",                                exists: true, phase: "M0" }
  - { file: "apps/desktop/dist/index.html",                exists: true, phase: "M6" }
  - { file: "apps/desktop/src-tauri/target/release/scenefab", exists: true, phase: "M2" }
  - { file: "apps/desktop/src/ipc/types.gen.ts",           exists: true, phase: "M3" }
  - { file: "docs/refactor/v3-migration/dod.yaml",         exists: true, phase: "M0" }

# ═══════════════════════════════════════════════════════════════════
# Rust 后端校验
# ═══════════════════════════════════════════════════════════════════
rust_crate:
  cargo_test_workspace:
    cmd: "cargo test --workspace --all-features"
    expect_exit_code: 0
    coverage:
      threshold_pct: 70
      excludes: ["*/tests/*", "*/examples/*", "*/benches/*"]

  cargo_clippy:
    cmd: "cargo clippy --workspace --all-features -- -D warnings"
    expect_exit_code: 0

  cargo_fmt:
    cmd: "cargo fmt --all -- --check"
    expect_exit_code: 0

  cargo_deny:
    cmd: "cargo deny check"
    expect_all_zero:
      - advisories
      - bans
      - licenses
      - sources

  cargo_build_release_matrix:
    targets:
      - x86_64-unknown-linux-gnu
      - x86_64-apple-darwin
      - aarch64-apple-darwin
      - x86_64-pc-windows-msvc
      - aarch64-pc-windows-msvc
    expect_exit_code: 0
    max_minutes: 30

# ═══════════════════════════════════════════════════════════════════
# React + TS 前端校验
# ═══════════════════════════════════════════════════════════════════
react_frontend:
  pnpm_typecheck:
    cmd: "pnpm typecheck"
    cwd: "apps/desktop"
    expect_exit_code: 0

  pnpm_lint:
    cmd: "pnpm lint"
    cwd: "apps/desktop"
    expect_exit_code: 0

  pnpm_unit_tests:
    cmd: "pnpm test --coverage --run"
    cwd: "apps/desktop"
    coverage:
      threshold_pct: 80
      excludes:
        - "src/components/ui/**"
        - "src/workers/**"

  pnpm_build:
    cmd: "pnpm build"
    cwd: "apps/desktop"
    expect_exit_code: 0
    output_dir: "apps/desktop/dist"
    bundle_limits_kb:
      main_entry: 200
      total_gzipped: 500

# ═══════════════════════════════════════════════════════════════════
# 功能完整性（每个功能特性的存在/数量验证）
# ═══════════════════════════════════════════════════════════════════
features:
  ipc_commands:
    count_required: 35
    cmd_files:
      - "apps/desktop/src-tauri/src/commands/project.rs"
      - "apps/desktop/src-tauri/src/commands/pipeline.rs"
      - "apps/desktop/src-tauri/src/commands/assets.rs"
      - "apps/desktop/src-tauri/src/commands/settings.rs"
      - "apps/desktop/src-tauri/src/commands/llm.rs"
      - "apps/desktop/src-tauri/src/commands/export.rs"
      - "apps/desktop/src-tauri/src/commands/theme.rs"
      - "apps/desktop/src-tauri/src/commands/update.rs"
      - "apps/desktop/src-tauri/src/commands/help.rs"
      - "apps/desktop/src-tauri/src/commands/diagnostics.rs"
      - "apps/desktop/src-tauri/src/commands/window.rs"
      - "apps/desktop/src-tauri/src/commands/plugin.rs"

  ipc_events:
    count_required: 24
    registry: "crates/scenefab-core/src/event.rs"

  specta_typegen:
    cmd: "cd apps/desktop/src-tauri && cargo test --features specta-export"
    output_file: "apps/desktop/src/ipc/types.gen.ts"
    expect_exit_code: 0
    drift_policy: "always commit generated file; CI rejects drift"

  llm_providers:
    functional_min: 5
    unit_tested_min: 11
    providers:
      - "Qwen"
      - "Kimi"
      - "GLM5"
      - "Claude"
      - "Gemini"
      - "DeepSeek"
      - "Doubao"
      - "Hunyuan"
      - "Local"
      - "OpenAI"
      - "Qwen3.7"

  pipeline_steps:
    count: 5
    names:
      - "素材导入"
      - "场景拆分"
      - "脚本生成"
      - "配音字幕"
      - "导出发布"

  multi_video_strategies:
    count: 4
    names: ["single", "concat", "batch", "series"]

  configuration_fallback_layers:
    - "keyring"
    - "yaml"
    - "environment"

  i18n:
    locales: ["zh-CN", "en-US"]
    expected_key_count:
      zh-CN: 488
      en-US: 474
    fallback_lang: "zh-CN"

# ═══════════════════════════════════════════════════════════════════
# 安全模型（编译期检查 + 运行时验证）
# ═══════════════════════════════════════════════════════════════════
security:
  path_whitelist:
    enabled: true
    impl: "crates/scenefab-core/src/security/path.rs"
    test_coverage_min: 90

  csp:
    enabled: true
    policy_in_tauri_conf: true
    forbid:
      - "'unsafe-inline'"   # 样式例外允许，script 不允许
      - "'unsafe-eval'"     # 例外：'wasm-unsafe-eval'

  keyring:
    enabled: true
    impl: "crates/scenefab-core/src/security/keyring.rs"
    api_key_via_ipc: false   # 绝不外泄
    log_redaction: true

  plugin_sandbox:
    enabled: true
    impl: "wasmtime 29"
    per_plugin_memory_limit_mb: 256
    per_plugin_cpu_slice_seconds_per_minute: 2

  api_key_in_frontend:
    via_invoke: false
    via_emit: false
    audit_test:
      description: "unit test asserts frontend can never obtain key material"
      file: "crates/scenefab-llm/tests/api_key_isolation.rs"

# ═══════════════════════════════════════════════════════════════════
# 可访问性 / 国际化
# ═══════════════════════════════════════════════════════════════════
accessibility:
  tool: "axe-core"
  violations_per_page: 0
  pages:
    - "/"
    - "/production"
    - "/assets"
    - "/settings"
    - "/updates"
    - "/help"

# ═══════════════════════════════════════════════════════════════════
# E2E / 集成测试
# ═══════════════════════════════════════════════════════════════════
e2e:
  playwright:
    test_files:
      - "tests/e2e/scenarios/smoke.spec.ts"
      - "tests/e2e/scenarios/theme.spec.ts"
      - "tests/e2e/scenarios/palette.spec.ts"
      - "tests/e2e/scenarios/pipeline.spec.ts"
      - "tests/e2e/scenarios/llm.spec.ts"
      - "tests/e2e/scenarios/export.spec.ts"
      - "tests/e2e/scenarios/settings.spec.ts"
      - "tests/e2e/scenarios/update.spec.ts"
    expect_pass: 15
    retry:
      process: 2
      in_container: 0
    timeout_ms: 30000

  visual_regression:
    tool: "playwright screenshot"
    pixel_diff_pct_threshold: 1
    themes: ["light", "dark"]
    pages:
      - { path: "/",          name: "home" }
      - { path: "/production", name: "production" }
      - { path: "/assets",    name: "assets" }
      - { path: "/settings",  name: "settings" }
      - { path: "/updates",   name: "updates" }
      - { path: "/help",      name: "help" }

# ═══════════════════════════════════════════════════════════════════
# 性能预算（脚本 scripts/perf-bench.sh）
# ═══════════════════════════════════════════════════════════════════
performance:
  cold_start_p95_ms: 500
  cold_start_test_platforms:
    - "macos-latest"
    - "ubuntu-latest"
    - "windows-latest"

  pipeline_p95_ratio_to_v24: 0.85
  pipeline_test_video: "tests/fixtures/1080p30_60s.mp4"

  theme_switch_p95_ms: 80
  route_switch_p95_ms: 100
  bundle_main_entry_kb: 200
  bundle_total_gzipped_kb: 500
  memory_idle_mb: 90
  memory_under_pipeline_mb: 220

# ═══════════════════════════════════════════════════════════════════
# 数据迁移
# ═══════════════════════════════════════════════════════════════════
data_migration:
  accepted_formats:
    - ".scenefab"
    - ".narrafilm"
  sample_count_min: 12
  loss_tolerance_count: 0
  tool: "crates/scenefab-migrate/src/bin/migrate.rs"

# ═══════════════════════════════════════════════════════════════════
# 平台 / 发行
# ═══════════════════════════════════════════════════════════════════
platforms:
  macos:
    min_version: "13.0"
    notarization: required
    code_signing: required
    artifact: "dmg"
  windows:
    min_version: "10.0.19041"
    code_signing: required
    artifact: "msi"
  linux:
    min_artifact_size_mb: 8
    artifact: "AppImage"
    distributions:
      - debian
      - ubuntu
      - fedora
      - arch

# ═══════════════════════════════════════════════════════════════════
# 自动更新
# ═══════════════════════════════════════════════════════════════════
updater:
  channel: "stable"
  endpoints:
    primary: "https://api.scenefab.dev/updates/v3/{{target}}/{{arch}}/{{current_version}}"
    fallback: "https://github.com/scenefab/scenefab/releases/latest/download/v3-update-{{target}}.json"
  sha256_verification: required
  backup_before_apply: true
  auto_apply_only_for_minor: true
  poc_required: true   # M10 阶段必须演练 1 次完整闭环

# ═══════════════════════════════════════════════════════════════════
# 签收矩阵
# ═══════════════════════════════════════════════════════════════════
sign_offs:
  gate_0: { phase: "M0",  required: ["TL", "RA", "FE", "QA"] }
  gate_1: { phase: "M1",  required: ["TL", "RA", "FE", "QA"] }
  gate_2: { phase: "M2",  required: ["TL", "RA", "FE"] }
  gate_3: { phase: "M3",  required: ["TL", "RA", "FE", "QA"] }
  gate_4: { phase: "M4",  required: ["TL", "RA", "FE", "QA"] }
  gate_5: { phase: "M5",  required: ["TL", "RA", "FE", "QA"] }
  gate_6: { phase: "M6",  required: ["TL", "FE", "QA"] }
  gate_7: { phase: "M7",  required: ["TL", "FE", "QA"] }
  gate_8: { phase: "M8",  required: ["TL", "RA", "FE", "QA"] }
  gate_9: { phase: "M9",  required: ["TL", "RA", "FE", "QA"] }
  gate_10: { phase: "M10", required: ["TL", "RA", "FE", "QA"] }

# ═══════════════════════════════════════════════════════════════════
# ADR 编号表（确保 ADR 与代码同步）
# ═══════════════════════════════════════════════════════════════════
adrs:
  - { id: "ADR-101", title: "彻底重写而非渐进式迁移",                    phase: "M0" }
  - { id: "ADR-102", title: "Workspace 多 crate 而非单体 crate",         phase: "M0" }
  - { id: "ADR-103", title: "IPC 用 Tauri Command 而非 HTTP",              phase: "M2" }
  - { id: "ADR-104", title: "UI 框架选 shadcn/ui + Tailwind v4",          phase: "M6" }
  - { id: "ADR-105", title: "持久化用 sqlx + sled",                       phase: "M3" }
  - { id: "ADR-106", title: "插件沙箱用 wasmtime",                        phase: "M5" }
  - { id: "ADR-107", title: "国际化用 i18next",                            phase: "M7" }
  - { id: "ADR-108", title: "测试用 cargo test + vitest + Playwright",      phase: "M9" }
  - { id: "ADR-109", title: "自动更新策略 GitHub Releases + 双端点 fallback", phase: "M10" }
  - { id: "ADR-110", title: "数据迁移 v2.narrafilm → v3.scenefab",          phase: "M9" }
  - { id: "ADR-111", title: "性能预算冷启动 + 5 步流水线 P95",              phase: "M8" }

# ═══════════════════════════════════════════════════════════════════
# 元信息
# ═══════════════════════════════════════════════════════════════════
meta:
  baseline_version: "v2.4.3"
  target_version: "v3.0.0"
  baseline_date: "2026-08-04"
  drafters:
    - role: "TL",  primary: true
    - role: "RA"
    - role: "FE"
    - role: "QA"
  review_rounds:
    - { date: "2026-07-31", topic: "整体架构与技术选型" }
    - { date: "2026-08-04", topic: "Rust crate 清单 + 映射表 + 风险矩阵" }
    - { date: "TBD",        topic: "M0 启动前 sign-off" }
