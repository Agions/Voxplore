[package]
name = "splicr-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust Native Multi-Agent Autonomous Video Storytelling Engine"

[dependencies]
splicr-core = { path = "../core" }
splicr-domain = { path = "../domain" }
splicr-detect = { path = "../detect" }
splicr-script = { path = "../script" }
splicr-voice = { path = "../voice" }
splicr-subtitle = { path = "../subtitle" }
splicr-compose = { path = "../compose" }
splicr-export = { path = "../export" }

async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
