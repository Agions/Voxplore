[package]
name = "splicr"
version = "1.0.0"
description = "splicr v1.0.0 · 叙影 — AI 影视解说桌面应用 (Tauri 2 + Rust)"
authors = ["Agions"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "splicr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"

# ── splicr 工作流 crates ──
# 基础层
splicr-core    = { path = "../crates/core" }
splicr-domain  = { path = "../crates/domain" }
# Step 1 素材导入
splicr-intake  = { path = "../crates/intake" }
# Step 2 智能拆条
splicr-detect  = { path = "../crates/detect" }
# Step 3 脚本生成
splicr-script  = { path = "../crates/script" }
# Step 4 TTS 配音
splicr-voice   = { path = "../crates/voice" }
# Step 5 字幕合成
splicr-subtitle = { path = "../crates/subtitle" }
# Step 6 画面对齐
splicr-compose = { path = "../crates/compose" }
# Step 7 多平台导出
splicr-export  = { path = "../crates/export" }
# 基础设施
splicr-storage = { path = "../crates/storage" }
splicr-update  = { path = "../crates/update" }
splicr-plugin  = { path = "../crates/plugin" }

# workspace lints / profiles 在根 Cargo.toml 集中定义