[package]
name = "monoloop"
version = "1.0.0"
description = "Monoloop v1.0.0 · 叙影 — AI 影视解说桌面应用 (Tauri 2 + Rust)"
authors = ["Agions"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "monoloop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"

# ── Monoloop 工作流 crates ──
# 基础层
monoloop-core    = { path = "../crates/core" }
monoloop-domain  = { path = "../crates/domain" }
# Step 1 素材导入
monoloop-intake  = { path = "../crates/intake" }
# Step 2 智能拆条
monoloop-detect  = { path = "../crates/detect" }
# Step 3 脚本生成
monoloop-script  = { path = "../crates/script" }
# Step 4 TTS 配音
monoloop-voice   = { path = "../crates/voice" }
# Step 5 字幕合成
monoloop-subtitle = { path = "../crates/subtitle" }
# Step 6 画面对齐
monoloop-compose = { path = "../crates/compose" }
# Step 7 多平台导出
monoloop-export  = { path = "../crates/export" }
# 基础设施
monoloop-storage = { path = "../crates/storage" }
monoloop-update  = { path = "../crates/update" }
monoloop-plugin  = { path = "../crates/plugin" }

# workspace lints / profiles 在根 Cargo.toml 集中定义